<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t2">
  <title id="t2">Illustrative mockup: a Langfuse Scores table, listing several faithfulness score runs by timestamp and value</title>
  <rect width="100%" height="100%" fill="#e2e8f0"/>
  <rect x="16" y="16" width="728" height="308" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- thin nav rail -->
  <rect x="16" y="16" width="150" height="308" rx="10" fill="#1e293b"/>
  <text x="34" y="42" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">langfuse</text>
  <text x="34" y="76" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#94a3b8">Tracing</text>
  <text x="34" y="98" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#94a3b8">Sessions</text>
  <text x="34" y="120" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#94a3b8">Users</text>
  <rect x="26" y="132" width="128" height="22" rx="5" fill="#334155"/>
  <text x="34" y="147" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">Scores</text>
  <text x="34" y="172" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#94a3b8">Datasets</text>
  <text x="34" y="194" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#94a3b8">Experiments</text>

  <!-- main content -->
  <text x="182" y="42" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Scores</text>
  <text x="182" y="62" font-family="Inter,system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8">Table</text>
  <text x="222" y="62" font-family="Inter,system-ui,sans-serif" font-size="10.5" fill="#94a3b8">Chart</text>
  <line x1="182" y1="68" x2="216" y2="68" stroke="#1d4ed8" stroke-width="2"/>

  <!-- table -->
  <line x1="182" y1="82" x2="716" y2="82" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="182" y="98" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569">Timestamp</text>
  <text x="330" y="98" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569">Name</text>
  <text x="460" y="98" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569">Value</text>
  <text x="560" y="98" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569">Comment</text>
  <line x1="182" y1="106" x2="716" y2="106" stroke="#e2e8f0" stroke-width="1.5"/>

  <g font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#0f172a">
    <text x="182" y="126">15:56:12</text><text x="330" y="126">faithfulness</text><text x="460" y="126" fill="#15803d" font-weight="700">0.83</text><text x="560" y="126" fill="#cbd5e1">—</text>
    <line x1="182" y1="136" x2="716" y2="136" stroke="#f1f5f9"/>
    <text x="182" y="152">15:42:40</text><text x="330" y="152">faithfulness</text><text x="460" y="152" fill="#b91c1c" font-weight="700">0.22</text><text x="560" y="152" fill="#cbd5e1">—</text>
    <line x1="182" y1="162" x2="716" y2="162" stroke="#f1f5f9"/>
    <text x="182" y="178">15:35:06</text><text x="330" y="178">faithfulness</text><text x="460" y="178" fill="#15803d" font-weight="700">0.79</text><text x="560" y="178" fill="#cbd5e1">—</text>
    <line x1="182" y1="188" x2="716" y2="188" stroke="#f1f5f9"/>
    <text x="182" y="204">15:33:38</text><text x="330" y="204">faithfulness</text><text x="460" y="204" fill="#b91c1c" font-weight="700">0.32</text><text x="560" y="204" fill="#cbd5e1">—</text>
    <line x1="182" y1="214" x2="716" y2="214" stroke="#f1f5f9"/>
    <text x="182" y="230">15:32:48</text><text x="330" y="230">faithfulness</text><text x="460" y="230" fill="#b91c1c" font-weight="700">0.32</text><text x="560" y="230" fill="#cbd5e1">—</text>
  </g>

  <text x="182" y="264" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-style="italic" fill="#64748b">Every run of your score_faithfulness() call lands here — a real log of how grounded each answer was, not just a single number you eyeballed once.</text>
</svg>
